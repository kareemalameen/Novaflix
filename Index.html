
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>NovaFlix | Movies, Series & Anime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#191e2b}
h1{color:#70baff;margin:0}
header p{color:#b8c5d9}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #424b60;background:#252b39;color:white;font-size:16px}
nav{display:flex;gap:9px;overflow:auto;padding:14px 16px}
nav button{white-space:nowrap}
button{padding:10px 14px;border:0;border-radius:8px;background:#2788ed;color:white;font-weight:bold}
button.active{background:#fff;color:#111827}
main{padding:16px}
h2{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#202636;border-radius:12px;overflow:hidden;padding:12px}
.poster{height:120px;display:grid;place-items:center;background:linear-gradient(135deg,#263c5c,#202636);font-size:43px;border-radius:8px}
.card h3{font-size:15px;margin-bottom:5px}
.muted{color:#bdc6d8;font-size:13px}
footer{padding:24px 16px;color:#aeb9ca;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>NovaFlix</h1>
  <p>Discover your next favourite story.</p>
  <input id="search" placeholder="Search movies, series or anime...">
</header>

<nav id="filters">
  <button class="active" data-type="All">All</button>
  <button data-type="Movie">Movies</button>
  <button data-type="Series">Series</button>
  <button data-type="Anime">Anime</button>
</nav>

<main>
  <h2 id="heading">Explore titles</h2>
  <div class="grid" id="catalogue"></div>
  <p id="empty" class="muted" hidden>No matching titles found.</p>
</main>

<footer>
  NovaFlix prototype · Movies, series and anime.
  Demo titles only. No films are streamed by this page yet.
</footer>

<script>
const titles=[
 {name:"African Stories",type:"Movie",icon:"🎬",year:2025},
 {name:"Space Adventures",type:"Series",icon:"🚀",year:2025},
 {name:"Anime World",type:"Anime",icon:"🌟",year:2025},
 {name:"Classic Cinema",type:"Movie",icon:"🎞️",year:2024},
 {name:"Mystery Files",type:"Series",icon:"🔍",year:2025},
 {name:"Creator Shorts",type:"Movie",icon:"🎥",year:2025}
];

let selected="All";
const grid=document.getElementById("catalogue");
const search=document.getElementById("search");
const empty=document.getElementById("empty");

function render(){
 const q=search.value.toLowerCase().trim();
 const matches=titles.filter(t=>
  (selected==="All"||t.type===selected)&&
  (t.name.toLowerCase().includes(q)||t.type.toLowerCase().includes(q))
 );
 grid.replaceChildren();
 matches.forEach(t=>{
  const card=document.createElement("article");
  card.className="card";
  const poster=document.createElement("div");
  poster.className="poster";
  poster.textContent=t.icon;
  const title=document.createElement("h3");
  title.textContent=t.name;
  const meta=document.createElement("p");
  meta.className="muted";
  meta.textContent=t.type+" · "+t.year;
  card.append(poster,title,meta);
  grid.append(card);
 });
 empty.hidden=matches.length!==0;
 document.getElementById("heading").textContent=
  selected==="All"?"Explore titles":selected;
}

document.getElementById("filters").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-type]");
 if(!btn)return;
 selected=btn.dataset.type;
 document.querySelectorAll("#filters button").forEach(b=>
  b.classList.toggle("active",b===btn)
 );
 render();
});
search.addEventListener("input",render);
render();
</script>
</body>
</html>
